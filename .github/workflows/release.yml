name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Every image is pinned rather than left on a -latest label. Those labels move
# on their own - ubuntu-latest goes to Ubuntu 26 between 19 October and
# 19 November 2026 - and what builds a release decides what the release needs.
# A Linux binary asks for the glibc symbol versions of whatever built it; this
# one needs GLIBC_2.39, which is what 24.04 ships, so drifting to a newer image
# would quietly raise the minimum glibc for everyone downloading it, with no
# change to the code. macOS and Windows are less exposed, but the same labels
# have changed architecture and toolchain under people before now.
#
# These are what the -latest labels point at today, so pinning them changes
# nothing except when it changes. Moving one is a deliberate edit from here:
# ubuntu-22.04 reaches further back, ubuntu-26.04 when the time comes.

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-26
            archive: tar.gz

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-26
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-2025'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fm84 dist/
          cp README.md LICENSE doc/fm84.1 dist/
          cd dist
          tar -czvf ../fm84-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/fm84.exe dist/
          Copy-Item README.md, LICENSE, doc/fm84.1 dist/
          Compress-Archive -Path dist/* -DestinationPath fm84-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fm84-${{ matrix.target }}
          path: fm84-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: FM84 ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/*

  # The same tag goes to crates.io, once every platform has built. Trusted
  # Publishing: crates.io is told, under the crate's settings, to accept this
  # repository's release.yml, and the auth action trades the run's GitHub
  # identity for a token that lasts only this job. No secret is stored.
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-24.04
    # A pre-release tag stays on GitHub; crates.io gets the real ones.
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A tag that is not the version in Cargo.toml would publish one number
      # under another's release. Stop before anything goes out.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
