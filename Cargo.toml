[package]
name = "fm84"
version = "0.36.0"
edition = "2024"
# Let chains in `if` and `while`, which the code leans on throughout, are
# stable from 1.88; sevenz-rust2, which reads and writes 7z, needs 1.93.
rust-version = "1.93"
license = "MIT"
description = "A synthwave dual-pane TUI file manager"
repository = "https://github.com/coltwillcox/fm84"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "dual-pane", "commander"]
categories = ["command-line-utilities", "filesystem"]
# The screenshots are for the README on GitHub, which links them from there;
# the published crate has no use for them.
exclude = ["images/", ".github/"]

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4.40"
color-eyre = "0.6.3"
crossterm = "0.29.0"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "optimization", "xz", "encoder"] }
ratatui = "0.29.0"
ruzstd = "0.9.1"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate", "compress"] }
syntect = "5.2"
tar = { version = "0.4.46", default-features = false }
trash = "5.2.9"
unicode-width = "0.2"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Dependencies built optimised even in debug builds. Unoptimised, image decoding
# runs 10-30x slower and opening a photo takes the better part of a second. Our
# own code stays quick to rebuild and fully debuggable.
[profile.dev.package."*"]
opt-level = 3

# Smaller and a little faster release binaries, at the cost of a slower
# release build. Panics still unwind: a worker thread that panics is noticed
# by the UI through its closed channel, which abort would turn into the whole
# program going down.
[profile.release]
lto = true
codegen-units = 1
strip = true
